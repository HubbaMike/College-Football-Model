name: Inspect committed CFBD extracts
on:
  push:
    paths:
      - ".github/workflows/inspect-cfbd-schema.yml"
      - "scripts/inspect_cfbd_schema.py"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect compressed CFBD data
        run: python scripts/inspect_cfbd_schema.py
      - name: Commit schema summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/cfbd_schema_inspection.json
          git commit -m "Add CFBD extract schema inspection" || exit 0
          git push
