name: Compress committed CFBD data
on:
  push:
    branches: [main]
    paths:
      - "scripts/compress_raw_data.py"
      - ".github/workflows/compress-cfbd-data.yml"
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compress raw JSON datasets
        run: python scripts/compress_raw_data.py
      - name: Commit compressed copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/compressed
          if ! git diff --cached --quiet; then
            git commit -m "Add compressed CFBD data extracts"
            git push
          fi
